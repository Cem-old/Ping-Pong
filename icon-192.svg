<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#gradient)"/>
  
  <!-- Ping pong table -->
  <rect x="32" y="80" width="128" height="64" rx="8" fill="#1e40af" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Table net -->
  <rect x="94" y="76" width="4" height="72" fill="#e5e7eb"/>
  <rect x="92" y="78" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="82" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="86" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="90" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="94" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="98" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="102" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="106" width="8" height="2" fill="#9ca3af"/>
  <rect x="92" y="110" width="8" height="2" fill="#9ca3af"/>
  
  <!-- Ping pong ball -->
  <circle cx="70" cy="96" r="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 66 92 Q 70 96 74 92" stroke="#e5e7eb" stroke-width="1" fill="none"/>
  <path d="M 66 100 Q 70 96 74 100" stroke="#e5e7eb" stroke-width="1" fill="none"/>
  
  <!-- Ping pong paddle -->
  <ellipse cx="130" cy="96" rx="12" ry="16" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <rect x="124" y="108" width="12" height="20" rx="2" fill="#92400e"/>
  
  <!-- Score display -->
  <rect x="48" y="48" width="96" height="24" rx="12" fill="#000000" fill-opacity="0.8"/>
  <text x="72" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">11</text>
  <text x="96" y="64" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">-</text>
  <text x="108" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">8</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>